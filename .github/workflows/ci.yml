name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # ISSUE-002：钉死的版本必须真的被装到，否则 range 又会悄悄漂移
      - run: python -m codeatlas.cli check-deps

  test:
    runs-on: ubuntu-latest
    env:
      PROVIDER_MODE: fake
      LANGFUSE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          load: true
          tags: codeatlas-api:ci
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
            PIP_TRUSTED_HOST=pypi.org
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # ISSUE-002：容器内的 qdrant-client / fastapi / pydantic 必须与 pyproject 钉死值一致。
      # 不一致就直接红，不要等到 P4 入库才发现写进去的数据和读出来的解释不同。
      - run: docker run --rm codeatlas-api:ci python -m codeatlas.cli check-deps
