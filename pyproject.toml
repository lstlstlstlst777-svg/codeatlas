[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeatlas"
version = "0.1.0"
description = "Code repository retrieval agent with verifiable citations"
requires-python = ">=3.11,<3.12"
# 全部钉死（ISSUE-002）：之前只写范围，导致容器装到 qdrant-client 1.20.0 / fastapi 0.161.1，
# 而宿主是 1.19.1 / 0.157.0。P4 要把 7019 个向量写进 Qdrant，客户端版本不一致会让
# collection 参数与 payload 解释出现差异，属于"本机能跑、容器爆炸"且难排查的坑。
# 升级流程：改版本 → 宿主 `make install` → 重建镜像 → `make check-deps` 确认容器与宿主一致。
dependencies = [
    "fastapi==0.157.0",
    "uvicorn[standard]==0.54.0",
    "sse-starlette==3.5.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "tenacity==9.2.1",
    "qdrant-client==1.19.1",
    "redis==6.4.0",
    "langgraph==1.2.16",
    "langgraph-checkpoint-sqlite==3.1.2",
    # checkpointer 的底层连接；虽然是上面那包的传递依赖，但它直接出现在我们代码里
    "aiosqlite==0.22.1",
    "langfuse==5.0.4",
    "structlog==25.5.0",
    # 0.26.0 的 Python 绑定与 tree-sitter-c 0.24.2 内打包的 runtime 结构体布局不兼容：
    # 大文件（如 Redis acl.c）从第 52 个顶层节点起行号会变成 0x40000000+n。
    # 实测 0.25.2 正常，故钉死，升级前必须用 tests/test_lines.py 的 Redis 全量用例验证。
    "tree-sitter==0.25.2",
    "tree-sitter-c==0.24.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
]

[project.scripts]
codeatlas = "codeatlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
