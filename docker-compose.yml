# 基础设施编排。api / web 在 P8 接入。
#
# 为什么先只起这两件：P4 的 dense 入库只需要 Qdrant，P7 的缓存需要 Redis；
# 把它们与开发环境解耦，本地改代码不必反复重建镜像。
#
# 启动：
#   docker compose up -d
#   docker compose ps
# 停止（保留数据）：
#   docker compose down
# 清空数据（会丢索引，慎用）：
#   docker compose down -v

services:
  # 全栈一条命令：docker compose up -d
  # api 启动前会等 qdrant / redis 健康，避免"容器起来了但第一次请求就 500"。
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    image: codeatlas-api:dev
    container_name: codeatlas-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 容器内用服务名而不是 localhost：localhost 在容器里指向容器自己
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      # SQLite 的 WAL 依赖共享内存，Windows bind mount 不支持（disk I/O error），
      # 所以 checkpointer 单独落在命名卷里（Linux 文件系统）
      CODEATLAS_CHECKPOINT_DB: /var/lib/codeatlas/checkpoints.sqlite
    volumes:
      # 索引（chunk store / bm25 / checkpoints）与源码挂在外面，
      # 改了数据不用重建镜像；代码库只读挂载，避免容器意外改动 vendor
      - ./data:/app/data
      - ./vendor:/app/vendor:ro
      - ./config:/app/config:ro
      # 前端是纯静态文件，挂进来改样式/JS 不用重建镜像（生产可去掉这行，用镜像内副本）
      - ./web:/app/web:ro
      - checkpoints:/var/lib/codeatlas
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    # 用 1panel 镜像站拉的副本；digest 与官方 qdrant/qdrant:latest 一致
    image: docker.1panel.live/qdrant/qdrant:latest
    container_name: codeatlas-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: codeatlas-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_storage:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_storage:
  redis_storage:
  checkpoints: